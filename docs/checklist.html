var role = "all";
try { role = localStorage.getItem("rl-ck-role") || "all"; } catch (e) {}
var store = {};
try { store = JSON.parse(localStorage.getItem("rl-ck-v2.2") || "{}"); } catch (e) {}
function save() { try { localStorage.setItem("rl-ck-v2.2", JSON.stringify(store)); localStorage.setItem("rl-ck-role", role); } catch (e) {} }
function key(id) { return role + ":" + id; }
function vis(it) { return role === "all" || it[1].indexOf(role) >= 0; }
var RN = { d: "设计", f: "前端", b: "后端", q: "测试" };

function render() {
  var html = "";
  DATA.forEach(function (fp) {
    var subsHtml = "";
    fp.subs.forEach(function (s) {
      var lis = "";
      s.items.forEach(function (it, i) {
        if (!vis(it)) return;
        var id = s.code + "-" + (i + 1), on = !!store[key(id)];
        lis += '<li class="' + (on ? "done" : "") + '"><input type="checkbox" data-id="' + id + '"' + (on ? " checked" : "") + ' aria-label="' + it[2].replace(/"/g, "&quot;") + '">' +
          '<div><span class="txt"><span class="cat">' + it[0] + "</span>" + it[2] +
          '<span class="rl">' + it[1].split("").map(function (r) { return RN[r]; }).join(" / ") + "</span></span>" +
          '<span class="exp">预期：' + it[3] + "</span></div></li>";
      });
      if (!lis) return;
      subsHtml += '<div class="subhead" data-sub="' + s.code + '"><h4>' + s.code + " " + s.name + '</h4><span class="pct"></span><a class="gopr" href="prd.html#' + s.code + '">查看PRD</a></div><ul class="items">' + lis + "</ul>";
    });
    if (!subsHtml) return;
    html += '<section class="fpbox" data-fp="' + fp.code + '"><div class="fphead"><h3>' + fp.code + " " + fp.name + '</h3><span class="pct"></span><a class="gopr" href="prd.html#' + fp.code + '">查看PRD</a></div>' + subsHtml + "</section>";
  });
  document.getElementById("list").innerHTML = html;
  calc();
}
function pctOf(boxes) {
  var n = boxes.length, c = boxes.filter(function (b) { return b.checked; }).length;
  return { n: n, c: c, p: n ? Math.round(c * 100 / n) : 0 };
}
function bar(r) { return "完成度 " + r.p + "%（" + r.c + "/" + r.n + '）<span class="bar"><i style="width:' + r.p + '%"></i></span>'; }
function calc() {
  document.querySelectorAll(".fpbox").forEach(function (sec) {
    sec.querySelector(".fphead .pct").innerHTML = bar(pctOf([].slice.call(sec.querySelectorAll("input"))));
    sec.querySelectorAll(".subhead").forEach(function (h) {
      h.querySelector(".pct").innerHTML = bar(pctOf([].slice.call(h.nextElementSibling.querySelectorAll("input"))));
    });
  });
  var t = pctOf([].slice.call(document.querySelectorAll("#list input")));
  document.getElementById("total").innerHTML = "总" + bar(t);
}
document.getElementById("list").addEventListener("change", function (e) {
  var b = e.target; if (!b.dataset.id) return;
  if (b.checked) store[key(b.dataset.id)] = 1; else delete store[key(b.dataset.id)];
  b.closest("li").classList.toggle("done", b.checked);
  save(); calc();
});
var rb = document.getElementById("roles");
ROLES.forEach(function (r) {
  var b = document.createElement("button"); b.type = "button"; b.textContent = r[1]; b.dataset.r = r[0];
  b.setAttribute("aria-pressed", r[0] === role);
  b.onclick = function () { role = r[0]; rb.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", x.dataset.r === role); }); save(); render(); };
  rb.appendChild(b);
});
document.getElementById("clear").onclick = function () {
  Object.keys(store).forEach(function (k) { if (k.indexOf(role + ":") === 0) delete store[k]; });
  save(); render();
};
document.getElementById("print").onclick = function () { window.print(); };
document.getElementById("csv").onclick = function () {
  var rows = [["角色视角", "大功能点", "子功能点", "编号", "类别", "适用角色", "检查什么", "预期结果", "已勾选"]];
  DATA.forEach(function (fp) { fp.subs.forEach(function (s) { s.items.forEach(function (it, i) {
    if (!vis(it)) return;
    var id = s.code + "-" + (i + 1);
    rows.push([ROLES.filter(function (r) { return r[0] === role; })[0][1], fp.code + " " + fp.name, s.code + " " + s.name, id, it[0],
      it[1].split("").map(function (r) { return RN[r]; }).join("/"), it[2], it[3], store[key(id)] ? "是" : "否"]);
  }); }); });
  var csv = "﻿" + rows.map(function (r) { return r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(","); }).join("\r\n");
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  a.download = "register-login-checklist-v2.2.csv";
  document.body.appendChild(a); a.click(); a.remove();
};
render();
</script>
</body>
</html>
